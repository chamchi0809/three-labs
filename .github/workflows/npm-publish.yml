name: npm-publish

# Pushing a tscene-v1.2.3 tag publishes that version of scene/lib to npm.
# A manual run only builds the tarball artifact (pass publish=true to publish).
on:
  push:
    tags: ["tscene-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "publish to npm"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: scene/lib
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
        working-directory: .
      - run: pnpm test
        working-directory: .
      - run: pnpm check
        working-directory: .

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#tscene-v}"

      # prepack builds dist/, so the tarball is what would be published
      - name: Pack
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: tscene-npm
          path: tscene-*.tgz

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PAT }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_PAT is not set in the repository secrets"; exit 1; }
          pnpm publish --access public --no-git-checks
